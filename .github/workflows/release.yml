name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash build/release/bin/vesta.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  vesta.exe" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "build/release/bin/vesta.exe"
            "SHA256SUMS.txt"
            "LICENSE"
            "NOTICE"
            "THIRD_PARTY_NOTICES.md"
          )

          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag --generate-notes @assets
          }
