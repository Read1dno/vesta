name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash build/release/bin/vesta.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  vesta.exe" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Attest GitHub Actions build
        uses: actions/attest@v4
        with:
          subject-path: build/release/bin/vesta.exe
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "build/release/bin/vesta.exe"
            "SHA256SUMS.txt"
            "LICENSE"
            "NOTICE"
            "THIRD_PARTY_NOTICES.md"
          )

          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag --generate-notes @assets
          }

          $repositoryUrl = "${{ github.server_url }}/${{ github.repository }}"
          $runUrl = "$repositoryUrl/actions/runs/${{ github.run_id }}"
          $releaseNotes = @(
            "## Verified GitHub Actions build"
            ""
            "The attached vesta.exe was compiled from this tag by GitHub Actions. Its signed build provenance links the binary to this repository, workflow run, commit, and tag."
            ""
            "Build: [$($env:GITHUB_SHA.Substring(0, 7))]($repositoryUrl/commit/$env:GITHUB_SHA) · [GitHub Actions run]($runUrl)"
            ""
            "Verify the downloaded binary with GitHub CLI:"
            ""
            '```powershell'
            "gh attestation verify .\\vesta.exe --repo ${{ github.repository }}"
            '```'
          ) -join "`n"
          $releaseNotes | Set-Content -Encoding utf8 RELEASE_NOTES.md
          gh release edit $tag --notes-file RELEASE_NOTES.md
